
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>Cowboy Party 3D</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  overflow: hidden;
  background: #17251e;
  font-family: Arial, sans-serif;
}

canvas {
  display: block;
  width: 100vw;
  height: 100vh;
  touch-action: none;
  cursor: grab;
}

#menu {
  position: fixed;
  top: 12px;
  left: 12px;
  right: 12px;
  padding: 12px;
  background: rgba(65,40,23,.94);
  border-radius: 12px;
  color: white;
  z-index: 10;
}

h3 {
  margin: 0 0 8px;
}

button {
  border: 1px solid #d4ad78;
  border-radius: 6px;
  padding: 8px 12px;
  margin: 3px;
  background: #a97642;
  color: white;
  cursor: pointer;
  font-size: 13px;
}

button:hover {
  background: #c39158;
}

#info {
  position: fixed;
  bottom: 12px;
  left: 12px;
  background: rgba(0,0,0,.75);
  color: white;
  padding: 10px;
  border-radius: 8px;
  font-size: 12px;
  pointer-events: none;
}
</style>
</head>

<body>

<div id="menu">
  <h3>COWBOY PARTY | 20 โต๊ะ</h3>
  <button onclick="view(0,1.57)">ด้านบน</button>
  <button onclick="view(0,.3)">ด้านหน้า</button>
  <button onclick="view(1.57,.5)">ด้านข้าง</button>
  <button onclick="view(-.4,.85)">มุม 3D</button>
  <button onclick="zoom(1.15)">ซูม +</button>
  <button onclick="zoom(.87)">ซูม -</button>
  <button onclick="auto=!auto">หมุนอัตโนมัติ</button>
  <button onclick="night=!night;draw()">กลางวัน / กลางคืน</button>
  <button onclick="full()">เต็มหน้าจอ</button>
  <button onclick="reset()">รีเซ็ต</button>
</div>

<canvas id="canvas"></canvas>

<div id="info">
  โต๊ะจีน 20 โต๊ะ | 200 ที่นั่ง<br>
  ลากเพื่อหมุน / สองนิ้วเพื่อซูม
</div>

<script>

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let W,H,S;
let yaw=-.4;
let pitch=.85;
let magnify=1;
let night=false;
let auto=false;

let faces=[];
let labels=[];

// =======================
// ระบบฉายภาพสามมิติ
// =======================

function project(x,y,z){

  let a=x*Math.cos(yaw)-z*Math.sin(yaw);

  let b=x*Math.sin(yaw)+z*Math.cos(yaw);

  return [
    W/2+a*S,
    H*.55+(b*Math.sin(pitch)-y*Math.cos(pitch))*S,
    b*Math.cos(pitch)+y*Math.sin(pitch)
  ];
}

function face(points,color){

  const p=points.map(v=>project(...v));

  faces.push({
    points:p,
    color:color,
    depth:p.reduce((sum,v)=>sum+v[2],0)/p.length
  });
}

// =======================
// สร้างกล่องสามมิติ
// =======================

function box(x,z,w,d,h,c,base=0){

  let a=[x-w/2,base,z-d/2];
  let b=[x+w/2,base,z-d/2];
  let e=[x+w/2,base,z+d/2];
  let f=[x-w/2,base,z+d/2];

  let A=[a[0],base+h,a[2]];
  let B=[b[0],base+h,b[2]];
  let E=[e[0],base+h,e[2]];
  let F=[f[0],base+h,f[2]];

  face([a,b,B,A],c[1]);
  face([b,e,E,B],c[2]);
  face([e,f,F,E],c[1]);
  face([f,a,A,F],c[2]);
  face([A,B,E,F],c[0]);
}

// =======================
// สร้างวัตถุทรงกลม
// =======================

function cylinder(x,z,r,h,base,c){

  let top=[];

  for(let i=0;i<24;i++){

    let a=i*Math.PI/12;
    let b=(i+1)*Math.PI/12;

    let p=[
      x+r*Math.cos(a),
      base,
      z+r*Math.sin(a)
    ];

    let q=[
      x+r*Math.cos(b),
      base,
      z+r*Math.sin(b)
    ];

    let u=[p[0],base+h,p[2]];
    let v=[q[0],base+h,q[2]];

    face([p,q,v,u],c[1]);
    top.push(u);
  }

  face(top,c[0]);
}

// =======================
// ป้ายข้อความ
// =======================

function label(text,x,y,z,color='#ffffff',size=1){

  labels.push({
    text:text,
    p:project(x,y,z),
    color:color,
    size:size
  });
}

// =======================
// ชุดสี
// =======================

const wood=['#a87948','#674127','#805333'];

const cream=['#fff5df','#c9b89c','#ded0b7'];

const gold=['#c38c49','#94602d','#aa7138'];

const dark=['#454545','#202020','#303030'];

const sand=['#dec7a1','#b99c75','#c7ae87'];

// =======================
// สร้างโต๊ะและเก้าอี้
// =======================

function table(x,z,n){

  const color=n<=5?gold:cream;

  cylinder(x,z,.12,.7,0,wood);

  cylinder(x,z,.75,.55,.12,color);

  cylinder(x,z,.8,.12,.67,color);

  cylinder(x,z,.22,.06,.79,cream);

  cylinder(x,z,.07,.16,.85,gold);

  // เก้าอี้ 10 ตัว

  for(let k=0;k<10;k++){

    let a=k*Math.PI/5;

    let xx=x+1.12*Math.cos(a);
    let zz=z+1.12*Math.sin(a);

    box(xx,zz,.38,.38,.45,cream);

    box(
      xx+.15*Math.cos(a),
      zz+.15*Math.sin(a),
      .25,.25,.4,cream,.45
    );
  }

  label(
    String(n),
    x,1.05,z,
    n<=5?'#ffffff':'#50321d',
    1
  );
}

// =======================
// เต็นท์บริการ
// =======================

function tent(x,z,w,d,text){

  box(x,z,w,d,.12,sand);

  for(let a of [-1,1]){
    for(let b of [-1,1]){

      box(
        x+a*(w/2-.1),
        z+b*(d/2-.1),
        .13,.13,2.3,wood
      );
    }
  }

  let A=[x-w/2,2.3,z-d/2];
  let B=[x+w/2,2.3,z-d/2];
  let C=[x+w/2,2.3,z+d/2];
  let D=[x-w/2,2.3,z+d/2];
  let T=[x,3.2,z];

  face([A,B,T],'#fff5df');
  face([B,C,T],'#d4c4a8');
  face([C,D,T],'#e8d8bd');
  face([D,A,T],'#c9b697');

  box(x,z,w*.8,.7,.9,wood);

  box(x,z,w*.85,.8,.12,cream,.9);

  label(text,x,3.5,z,'#ffffff',1);
}

// =======================
// สร้างต้นไม้
// =======================

function tree(x,z){

  cylinder(x,z,.2,2.3,0,wood);

  cylinder(
    x,z,1.05,1.2,2,
    ['#4b783c','#31532b']
  );

  cylinder(
    x,z,.75,.9,3.1,
    ['#5b8947','#3b6634']
  );
}

// =======================
// ไฟประดับ
// =======================

function light(x,z){

  box(x,z,.12,.12,1.2,wood);

  cylinder(
    x,z,.14,.25,1.2,
    ['#fff5a5','#e8aa42']
  );
}

// =======================
// สร้างแผนผังทั้งหมด
// =======================

function build(){

  faces=[];
  labels=[];

  // พื้นสนาม

  let grass=night
    ? ['#30492d','#22351f','#294027']
    : ['#789453','#526d38','#607c42'];

  box(0,0,20,25,.25,grass,-.25);

  // ทางเดินหลัก

  box(-1.7,1,2.2,16,.03,sand);

  // พื้นที่หน้าเวที

  box(0,-7.2,18,2.5,.04,sand);

  label(
    'พื้นที่กิจกรรมหน้าเวที',
    0,.2,-7.2,'#51351e',1.1
  );

  // เวทีหลัก

  box(0,-10.3,11,3.6,.6,wood);

  box(0,-11.9,11,.25,3.2,wood,.6);

  box(-5.3,-10.3,.2,.2,4,wood);
  box(5.3,-10.3,.2,.2,4,wood);

  box(0,-10.3,11,3.8,.2,wood,4);

  // ลำโพง

  box(-4.7,-9.4,.8,.7,1.7,dark,.6);
  box(4.7,-9.4,.8,.7,1.7,dark,.6);

  // กลอง

  cylinder(0,-10.5,.45,.7,.6,dark);
  cylinder(-.7,-10.7,.25,.5,.6,gold);
  cylinder(.7,-10.7,.25,.5,.6,gold);

  label('เวทีหลัก',0,4.5,-10.3,'#ffffff',1.5);

  label(
    'ดนตรีสด / พิธีกร / จับรางวัล',
    0,2.8,-10.3,'#ffffff',.9
  );

  // เครื่องเสียงและของรางวัล

  tent(-7.9,-10.3,3.2,3,'เครื่องเสียงและไฟ');

  tent(7.9,-10.3,3.2,3,'ของรางวัล');

  // โต๊ะจีน 20 โต๊ะ

  const xs=[-7.8,-4.4,.8,4.3,7.8];

  let number=1;

  for(let row=0;row<4;row++){
    for(let col=0;col<5;col++){

      table(
        xs[col],
        -4.2+row*3.1,
        number++
      );
    }
  }

  // จุดลงทะเบียน

  tent(0,9,4.5,2.8,'จุดลงทะเบียน');

  // เครื่องดื่ม

  tent(6.5,9,5,2.8,'จุดบริการเครื่องดื่ม');

  // มุมถ่ายรูป

  box(-6.5,9,5,2.8,.15,sand);

  box(-6.5,8,5,.2,2.8,wood);

  label('จุดถ่ายรูป',-6.5,3.2,8.5);

  label('COWBOY',-6.5,2,8.3,'#ffffff',1.3);

  // กองฟาง

  box(-8.4,9.8,.9,.7,.65,gold);
  box(-4.6,9.8,.9,.7,.65,gold);

  // ถังไม้

  cylinder(-8.5,8.7,.4,.85,0,wood);
  cylinder(-4.5,8.7,.4,.85,0,wood);

  // ซุ้มทางเข้า

  box(-2,11.8,.3,.3,3,wood);
  box(2,11.8,.3,.3,3,wood);

  box(0,11.8,4.5,.4,.45,wood,3);

  label('ทางเข้างาน',0,3.8,11.8);

  // รั้วไม้และไฟ

  for(let z=-12;z<=12;z+=2){

    for(let x of [-9.8,9.8]){

      light(x,z);

      if(z<12){

        box(x,z+1,.1,2,.12,wood,.4);

        box(x,z+1,.1,2,.12,wood,.85);
      }
    }
  }

  // ต้นไม้รอบงาน

  for(let z of [-10,-3,4,11]){
    tree(-11.5,z);
    tree(11.5,z);
  }
}

// =======================
// แสดงผลภาพ
// =======================

function draw(){

  W=canvas.clientWidth;
  H=canvas.clientHeight;

  let dpi=Math.min(
    window.devicePixelRatio||1,2
  );

  canvas.width=W*dpi;
  canvas.height=H*dpi;

  ctx.setTransform(dpi,0,0,dpi,0,0);

  S=Math.min(W/31,H/34)*magnify;

  ctx.fillStyle=night?'#101d1b':'#e6e5dc';

  ctx.fillRect(0,0,W,H);

  build();

  // เรียงวัตถุตามระยะ

  faces.sort((a,b)=>a.depth-b.depth);

  for(let f of faces){

    ctx.beginPath();

    f.points.forEach((p,i)=>{

      if(i===0){
        ctx.moveTo(p[0],p[1]);
      }else{
        ctx.lineTo(p[0],p[1]);
      }
    });

    ctx.closePath();

    ctx.fillStyle=f.color;
    ctx.fill();
  }

  // แสดงหมายเลขโต๊ะและป้าย

  for(let l of labels){

    let size=Math.max(
      9,
      Math.min(22,S*.8*l.size)
    );

    ctx.font='bold '+size+'px Arial';

    ctx.textAlign='center';
    ctx.textBaseline='middle';

    ctx.lineJoin='round';

    ctx.strokeStyle=
      l.color==='#ffffff'
      ? '#51351e'
      : '#fff5df';

    ctx.lineWidth=3;

    ctx.strokeText(
      l.text,l.p[0],l.p[1]
    );

    ctx.fillStyle=l.color;

    ctx.fillText(
      l.text,l.p[0],l.p[1]
    );
  }
}

// =======================
// ปุ่มควบคุม
// =======================

function view(a,b){

  auto=false;
  yaw=a;
  pitch=b;
  draw();
}

function zoom(v){

  magnify=Math.max(
    .45,
    Math.min(3,magnify*v)
  );

  draw();
}

function reset(){

  yaw=-.4;
  pitch=.85;
  magnify=1;
  auto=false;
  draw();
}

function full(){

  if(document.fullscreenElement){

    document.exitFullscreen();

  }else if(document.documentElement.requestFullscreen){

    document.documentElement
      .requestFullscreen()
      .catch(()=>alert('ไม่สามารถเปิดเต็มหน้าจอได้'));
  }
}

// =======================
// เมาส์และหน้าจอสัมผัส
// =======================

let pointers=new Map();
let distance=0;

canvas.addEventListener('pointerdown',e=>{

  auto=false;

  canvas.setPointerCapture(e.pointerId);

  pointers.set(
    e.pointerId,
    [e.clientX,e.clientY]
  );

  if(pointers.size===2){

    let p=[...pointers.values()];

    distance=Math.hypot(
      p[0][0]-p
